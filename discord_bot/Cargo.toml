[package]
name = "tatarbot-discord"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "utils", "rustls_backend", "voice"] }
# Voice (incl. DAVE end-to-end encryption) and the per-guild track queue.
songbird = { version = "0.6", features = ["builtin-queue"] }
# Decoders Songbird uses for streams and files (pure Rust, no ffmpeg).
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# Songbird's HTTP inputs take a reqwest 0.12 client; this one gets an SSRF-safe resolver.
reqwest-audio = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
toml = "0.9"
url = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
