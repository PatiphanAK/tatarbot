# Manual deploy of the Agent Runtime to the GCP VM (systemd unit tatarbot-runtime, infra/gcp).

name: Deploy runtime (GCP)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch on main to deploy
        type: string
        default: main

permissions:
  contents: read
  id-token: write

# One deploy per service at a time; never cancel one halfway through a switch.
concurrency:
  group: deploy-gcp-tatarbot-runtime
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-gce.yml
    with:
      ref: ${{ inputs.ref }}
      service: runtime
