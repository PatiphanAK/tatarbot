# CI for agent_runtime only: lint, unit tests (incl. the RAG migrations against Postgres +
# pgvector), image build and integration tests against a mock OpenAI-compatible model.
# No secrets, no Discord, no GPU, no AWS.

name: CI runtime

on:
  pull_request:
    paths: &paths
      - agent_runtime/**
      - integration/**
      - compose.yaml
      - .github/workflows/ci-runtime.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.22" # keep in sync with agent_runtime/Dockerfile

jobs:
  checks:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_runtime
    # Migration tests create and drop a database per test. Same image as compose.yaml.
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-trixie
        env:
          POSTGRES_USER: tatarbot
          POSTGRES_PASSWORD: tatarbot-ci
          POSTGRES_DB: tatarbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tatarbot -d tatarbot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tatarbot:tatarbot-ci@127.0.0.1:5432/tatarbot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tags since v8)
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          working-directory: agent_runtime
          cache-dependency-glob: agent_runtime/uv.lock
      - run: uv sync --locked
      - run: make lint
      - name: Lint integration tests
        run: uv run ruff check ../integration && uv run ruff format --check ../integration
      - run: make test

  image-integration:
    name: image + integration tests
    runs-on: ubuntu-24.04-arm # same architecture as the deployed image
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build runtime image and test it against the mock model
        run: ./integration/run.sh
