# Reusable: deploy the Discord bot image to the TatarBot VM on GCP (infra/gcp).
# (The Agent Runtime deploys to Cloud Run: _deploy-cloudrun.yml.)
#
# 1. Only commits already on main can be deployed.
# 2. The image is tagged sha-<commit>; Artifact Registry tags are immutable, so an existing
#    tag is reused and never rebuilt.
# 3. Images are built for linux/amd64 (e2 machines are x86) on an amd64 runner, no QEMU.
# 4. The job SSHes to the VM through IAP (OS Login, no stored SSH key) and runs
#    /etc/tatarbot/deploy.sh, which switches the systemd unit to the new image, waits until
#    the bot is connected to Discord, and rolls back to the previous image if it isn't.
#
# Requires, in the `production` environment variables (terraform output github_actions_variables):
#   GCP_PROJECT_ID, GCP_REGION, GCP_ZONE, GCP_VM_NAME, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
# No long-lived keys: the job exchanges its GitHub OIDC token through Workload Identity
# Federation, which trusts only this repository's production environment.

name: Deploy to GCE (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to deploy (must be on main)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy discord
    runs-on: ubuntu-24.04
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      SERVICE: discord
    steps:
      - name: Require deployment configuration
        run: |
          missing=""
          for v in GCP_PROJECT_ID GCP_REGION GCP_ZONE GCP_VM_NAME GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deployment is not configured. Set these variables on the 'production' environment:$missing (see infra/gcp/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit and check it is on main
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$sha is not on main; only reviewed commits are deployed."; exit 1; }
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/tatarbot-$SERVICE/tatarbot-$SERVICE:sha-${sha::12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Does the image already exist?
        id: exists
        env:
          IMAGE: ${{ steps.commit.outputs.image }}
        run: |
          if gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image $IMAGE"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.found != 'true'

      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.found != 'true'
        with:
          context: discord_bot
          platforms: linux/amd64
          push: true
          tags: ${{ steps.commit.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=tatarbot-discord-amd64
          cache-to: type=gha,mode=max,scope=tatarbot-discord-amd64

      - name: Switch the VM to the image (IAP SSH, rolls back on failure)
        env:
          IMAGE: ${{ steps.commit.outputs.image }}
        run: |
          gcloud compute ssh "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" \
            --tunnel-through-iap --quiet \
            --strict-host-key-checking=no \
            --command "sudo bash /etc/tatarbot/deploy.sh $SERVICE $IMAGE"

      - name: Summary
        env:
          IMAGE: ${{ steps.commit.outputs.image }}
        run: echo "Deployed \`$IMAGE\` to \`$GCP_VM_NAME\` (tatarbot-$SERVICE)." >> "$GITHUB_STEP_SUMMARY"
