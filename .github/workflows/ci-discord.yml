# CI for discord_bot only: fmt, clippy, tests, and an image build with a startup smoke test.
# No secrets and no Discord token.

name: CI discord

on:
  pull_request:
    paths: &paths
      - discord_bot/**
      - compose.yaml
      - .github/workflows/ci-discord.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-discord-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99" # keep in sync with discord_bot/Dockerfile

jobs:
  checks:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord_bot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: discord_bot
      - run: make check

  library:
    name: library (Postgres races, RustFS, ffmpeg, sqlx cache)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord_bot
    env:
      SQLX_CLI_VERSION: "0.9.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: discord_bot
          cache-bin: true
      - name: Install ffmpeg and sqlx-cli
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
          sqlx --version 2>/dev/null | grep -q "$SQLX_CLI_VERSION" ||
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked \
              --no-default-features --features rustls,postgres
      # Starts Postgres + RustFS from ../compose.yaml, then runs the ignored
      # integration tests: advisory-lock races, sweep grace, S3, ffmpeg, end to end.
      - run: make test-db
      - name: .sqlx cache matches the queries
        run: make sqlx-check

  image:
    name: image build + smoke (${{ matrix.arch }})
    # Same architecture as the deployed images: amd64 on GCP, arm64 on AWS until it is
    # torn down (then drop arm64).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: discord_bot
          tags: tatarbot-discord:ci
          load: true
          push: false
          cache-from: type=gha,scope=tatarbot-discord-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tatarbot-discord-${{ matrix.arch }}
      - name: Fails fast without a token
        run: |
          docker run --rm --read-only tatarbot-discord:ci 2>&1 | tee out.txt || true
          grep -q 'MissingEnv("DISCORD_TOKEN")' out.txt
      - name: Stops cleanly on SIGTERM
        # No network, so the gateway connection keeps retrying until the signal arrives.
        run: |
          docker run -d --name bot --read-only --network none -e DISCORD_TOKEN=x.y.z tatarbot-discord:ci
          sleep 3
          docker stop -t 15 bot
          test "$(docker inspect -f '{{.State.ExitCode}}' bot)" = 0
          docker logs bot 2>&1 | grep -q 'shutting down'
      # The ingest worker image (ADR 0004): same build stage, its own target.
      - uses: docker/build-push-action@v7
        with:
          context: discord_bot
          target: worker
          tags: tatarbot-ingest-worker:ci
          load: true
          push: false
          cache-from: type=gha,scope=tatarbot-discord-${{ matrix.arch }}
      - name: Worker transcodes with the image's ffmpeg under its limits
        # A 3 s WAV made without ffmpeg; the read-only root and the tmpfs mirror Cloud Run.
        run: |
          mkdir -p in
          python3 - <<'PY2'
          import math, struct, wave
          with wave.open("in/tone.wav", "wb") as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(48000)
              w.writeframes(b"".join(struct.pack("<hh", v, v) for v in
                  (int(8000 * math.sin(2 * math.pi * 440 * i / 48000)) for i in range(3 * 48000))))
          PY2
          docker run --rm --read-only --tmpfs /tmp --cpus 1 --memory 1g -v "$PWD/in:/in:ro" \
            tatarbot-ingest-worker:ci bench /in/tone.wav | tee bench.json
          grep -q '"ok":true' bench.json
