# Local development: both services as separate containers on the default Compose network,
# mirroring the two independent ECS services. The bot reaches the runtime by service name.
# The app services publish no port. The bot's music library uses Postgres and RustFS
# (S3-compatible), published on 127.0.0.1 only so `cargo run` and `sqlx` work from the host
# (non-default ports, so they don't clash with local installs).
#
#   docker compose up --build                 # whole stack
#   docker compose up --build agent_runtime   # runtime only
#   docker compose up -d postgres rustfs      # library backends for `make -C discord_bot run`
#
# To run one service's container against something outside Compose, use
# `make -C agent_runtime image-run` or `make -C discord_bot image-run` instead.
#
# Configuration comes from agent_runtime/.env and discord_bot/.env (`make -C <service> env`).
# AGENT_API_KEY must be the same in both. `depends_on` only orders local startup; in ECS the
# services start independently and the bot tolerates an unavailable runtime per message.

services:
  agent_runtime:
    build: agent_runtime
    image: tatarbot-agent-runtime:local
    env_file:
      - path: agent_runtime/.env
        required: false
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: "8080"
    # Lets MODEL_BASE_URL=http://host.docker.internal:8000/v1 reach a model on this machine.
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  discord_bot:
    build: discord_bot
    image: tatarbot-discord:local
    env_file:
      - path: discord_bot/.env
        required: false
    environment:
      AGENT_BASE_URL: http://agent_runtime:8080
      # Music library (Phase 1.5). The bot starts and plays radio without these.
      DATABASE_URL: postgres://tatarbot:tatarbot-local@postgres:5432/tatarbot
      MUSIC_S3_BUCKET: tatarbot-music
      MUSIC_S3_ENDPOINT: http://rustfs:9000
      MUSIC_S3_CREATE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: tatarbot-local
      AWS_SECRET_ACCESS_KEY: tatarbot-local-secret
      AWS_REGION: us-east-1
    depends_on:
      agent_runtime:
        condition: service_healthy
      # Started with the bot, but not waited for: the bot copes with both being down.
      postgres:
        condition: service_started
      rustfs:
        condition: service_started
    restart: unless-stopped

  # Local stand-ins for Supabase Postgres and S3. Throwaway credentials, localhost only.
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: tatarbot
      POSTGRES_PASSWORD: tatarbot-local
      POSTGRES_DB: tatarbot
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tatarbot", "-d", "tatarbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: tatarbot-local
      RUSTFS_SECRET_KEY: tatarbot-local-secret
      RUSTFS_VOLUMES: /data
    ports:
      - 127.0.0.1:${RUSTFS_PORT:-59000}:9000
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  rustfs-data:
